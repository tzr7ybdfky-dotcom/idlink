[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "idlink"
version = "0.1.0"
description = "Public profile linkage audit using explainable heuristics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12", "Pillow>=10", "imagehash>=4.3", "rapidfuzz>=3", "networkx>=3", "pydantic>=2,<3", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=1.14", "types-networkx>=3.4", "types-beautifulsoup4>=4.12"]

[project.scripts]
idlink = "idlink.cli:main"

[tool.setuptools.packages.find]
include = ["idlink*"]

[tool.setuptools.package-data]
"idlink.data" = ["*.txt", "*.json", "SHERLOCK-LICENSE"]
"idlink.assets" = ["*.html", "*.js", "D3-LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
